name: Windows ARM64 GPU driver bring-up

on:
  workflow_dispatch:
  push:
    branches: ['gpu-driver-build/**']
    paths: ['drivers/windows/**', 'gpu/**', '.github/workflows/windows-gpu.yml']

permissions:
  contents: read

jobs:
  driver:
    runs-on: windows-2025-vs2026
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64
      - uses: NuGet/setup-nuget@v2
      - uses: actions/cache/restore@v4
        id: wdk_cache
        with:
          path: drivers/windows/packages
          key: gpu-wdk-${{ runner.os }}-${{ hashFiles('drivers/windows/packages.config') }}
      - name: Restore pinned WDK and SDK
        id: restore_wdk
        run: nuget restore drivers/windows/packages.config -PackagesDirectory drivers/windows/packages -NonInteractive
      - name: Inspect WDK tool locations
        shell: pwsh
        run: |
          $toolNames = @('stampinf.exe', 'InfVerif.exe', 'Inf2Cat.exe')
          foreach ($name in $toolNames) {
            $candidates = @(Get-ChildItem drivers/windows/packages -Recurse -Filter $name)
            $tool = $candidates | Where-Object FullName -Match '\\x64\\' | Select-Object -First 1
            if (-not $tool) { $tool = $candidates | Where-Object FullName -Match '\\x86\\' | Select-Object -First 1 }
            if (-not $tool) { throw "Missing x64/x86 WDK host tool: $name" }
            Write-Output "$name => $($tool.FullName)"
            $tool.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            $tool.Directory.Parent.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
          Get-ChildItem drivers/windows/packages -Recurse -Include '*.props','*.targets' |
            Select-String -Pattern 'StampInfToolPath|WdkBinRoot|WDKBinRoot|StampInfExe' |
            Select-Object -First 25 Path,Line
      - name: Compile ARM64 experimental WDDM driver
        shell: pwsh
        run: |
          $out = "$env:GITHUB_WORKSPACE\build\windows-gpu\driver\"
          msbuild drivers/windows/kmdod/Sample/SampleDisplay.vcxproj /t:Build /m /p:Configuration=Release /p:Platform=ARM64 /p:PreferredToolArchitecture=x64 /p:SignMode=Off "/p:OutDir=$out" /p:Inf2CatUseLocalTime=true /fl /flp:logfile=driver-build.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Compile ARM64 GPU probe
        shell: pwsh
        run: |
          $out = "$env:GITHUB_WORKSPACE\build\windows-gpu\probe\"
          msbuild drivers/windows/probe/WinGpuProbe.vcxproj /t:Build /m /p:Configuration=Release /p:Platform=ARM64 /p:PreferredToolArchitecture=x64 "/p:OutDir=$out" /fl /flp:logfile=probe-build.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Compile independent ARM64 PCI diagnostic driver
        shell: pwsh
        run: |
          $out = "$env:GITHUB_WORKSPACE\build\windows-gpu\diagnostic\"
          msbuild drivers/windows/diagnostic/WinGpuDiagnostic.vcxproj /t:Build /m /p:Configuration=Release /p:Platform=ARM64 /p:PreferredToolArchitecture=x64 /p:SignMode=Off "/p:OutDir=$out" /p:Inf2CatUseLocalTime=true /fl /flp:logfile=diagnostic-build.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Package test-signed diagnostic driver
        shell: pwsh
        run: ./drivers/windows/package-diagnostic.ps1
      - uses: actions/cache/save@v4
        if: always() && steps.wdk_cache.outputs.cache-hit != 'true' && steps.restore_wdk.outcome == 'success'
        with:
          path: drivers/windows/packages
          key: gpu-wdk-${{ runner.os }}-${{ hashFiles('drivers/windows/packages.config') }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-arm64-gpu-bringup
          path: |
            build/windows-gpu/
            driver-build.log
            probe-build.log
            diagnostic-build.log
          retention-days: 7
